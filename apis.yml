aid: flyhomes
name: FlyHomes
description: >-
  Flyhomes is a Bellevue, Washington-based real estate and mortgage financial
  technology company whose Buy Before You Sell platform lets homebuyers purchase
  a new home before selling their existing one. Its products—Flyhomes Cash Offer,
  Instant Equity, and Guaranteed Backup Contract—turn financing into competitive
  cash-like offers, unlock home equity without requiring a prior sale, and reduce
  a buyer's debt-to-income ratio so they can qualify for larger loans and move
  only once. Flyhomes reaches homebuyers through a network of in-network loan
  officers and real estate agents and also operates an AI-powered home search
  portal. Flyhomes does not currently publish a public developer API; this profile
  captures its identity, discovery surface (llms.txt), and domain-security posture.
